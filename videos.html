<script>
(function(){
  "use strict";
  var list = document.getElementById('videoList');
  NOBLAE_loadVideos().then(function(videos){
    videos.forEach(function(v){ list.appendChild(NOBLAE_videoEl(v)); });
    if (!videos.length){
      var p = document.createElement('p');
      p.className = 'gallery-intro';
      p.textContent = 'No videos yet.';
      list.appendChild(p);
      return;
    }
    window.NOBLAE_paginate(list, '.video');
  });
})();
</script>
