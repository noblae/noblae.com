<script>
(function(){
  "use strict";

  // ---------- home feed ----------
  // Pulls every entry from the Poetry, Essays and Fights pages, so new
  // content only ever needs to be added on its own page.
  var SOURCES = [
    { url: 'poetry.html', selector: '.poem',       kind: 'poem'  },
    { url: 'essays.html', selector: '.essay',      kind: 'essay' },
    { url: 'fights.html', selector: '.fight-card', kind: 'fight' }
  ];
  var DATE_RE = /(\d{2})\.(\d{2})\.(\d{2})/;

  var feed = document.getElementById('feed');

  function load(src){
    // cache-bust: without this, browsers (and GitHub's CDN) can serve a
    // stale copy of poetry.html/essays.html/fights.html here even right
    // after the admin panel has updated the live file
    return fetch(src.url + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        return Array.prototype.slice.call(doc.querySelectorAll(src.selector)).map(function(el){
          return entryFrom(el, src.kind);
        }).filter(Boolean);
      })
      .catch(function(){ return []; });
  }

  // Finds the entry's MM.DD.YY date, pulls it out of the entry, and
  // returns the entry with the date placed at its bottom-right.
  function entryFrom(el, kind){
    var dateEl = el.querySelector('.poem-date, .entry-date, .fight-meta .tag');
    var m = dateEl && dateEl.textContent.match(DATE_RE);
    if (!m) return null;
    var label = m[0];
    if (dateEl.classList.contains('tag')){
      dateEl.textContent = dateEl.textContent.replace(DATE_RE, '').replace(/[\s\u00b7]+$/, '');
    } else {
      dateEl.remove();
    }

    var item = document.createElement('article');
    item.className = 'feed-item feed-' + kind;
    item.appendChild(document.importNode(el, true));
    var date = document.createElement('span');
    date.className = 'entry-date feed-date';
    date.textContent = label;
    item.appendChild(date);

    return { node: item, time: new Date(2000 + +m[3], +m[1] - 1, +m[2]).getTime() };
  }

  // ---------- images (same list as the Images page) ----------
  var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var FOLDER_URL = (LOCAL ? '/__dev_api' : 'https://api.github.com') +
                   '/repos/noblae/noblae.com/contents/images/gallery?ref=main';
  function getJSON(url){
    return fetch(url, { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; });
  }
  // an image's date: the one saved by the admin page, or else the
  // YYYYMMDD at the start of its file name (e.g. 20260928-....jpg)
  function imageTime(img){
    var m = img.date && img.date.match(DATE_RE);
    if (m) return { time: new Date(2000 + +m[3], +m[1] - 1, +m[2]).getTime(), label: m[0] };
    var f = img.src.split('/').pop().match(/^(20\d{2})(\d{2})(\d{2})/);
    if (f) return { time: new Date(+f[1], +f[2] - 1, +f[3]).getTime(), label: f[2] + '.' + f[3] + '.' + f[1].slice(2) };
    return { time: 0, label: '' };   // no date: goes to the end of the feed
  }
  function loadImages(){
    return Promise.all([getJSON('images.json?v=' + Date.now()), getJSON(FOLDER_URL)])
      .then(function(r){ return window.NOBLAE_mergeImages(Array.isArray(r[0]) ? r[0] : [], Array.isArray(r[1]) ? r[1] : []); })
      .then(function(images){
        return images.map(function(img){
          var when = imageTime(img);
          var item = document.createElement('article');
          item.className = 'feed-item feed-image';
          var fig = document.createElement('figure');
          var a = document.createElement('a');
          a.href = img.src; a.target = '_blank'; a.rel = 'noopener';
          var el = document.createElement('img');
          el.src = img.src; el.alt = img.caption || ''; el.loading = 'lazy';
          a.appendChild(el);
          fig.appendChild(a);
          if (img.caption){
            var cap = document.createElement('figcaption');
            cap.textContent = img.caption;
            fig.appendChild(cap);
          }
          item.appendChild(fig);
          if (when.label){
            var date = document.createElement('span');
            date.className = 'entry-date feed-date';
            date.textContent = when.label;
            item.appendChild(date);
          }
          return { node: item, time: when.time };
        });
      })
      .catch(function(){ return []; });
  }

  // ---------- videos (same list as the Videos page) ----------
  function loadVideos(){
    return window.NOBLAE_loadVideos().then(function(videos){
      return videos.map(function(v){
        var m = v.date && v.date.match(DATE_RE);
        var item = document.createElement('article');
        item.className = 'feed-item feed-video';
        item.appendChild(window.NOBLAE_videoEl(v, { noDate: true }));
        if (m){
          var date = document.createElement('span');
          date.className = 'entry-date feed-date';
          date.textContent = m[0];
          item.appendChild(date);
        }
        return { node: item, time: m ? new Date(2000 + +m[3], +m[1] - 1, +m[2]).getTime() : 0 };
      });
    }).catch(function(){ return []; });
  }

  Promise.all(SOURCES.map(load).concat([loadImages(), loadVideos()])).then(function(lists){
    var entries = [].concat.apply([], lists);
    // newest first; entries on the same day keep their page order
    entries.forEach(function(e, i){ e.order = i; });
    entries.sort(function(a, b){ return (b.time - a.time) || (a.order - b.order); });
    entries.forEach(function(e){ feed.appendChild(e.node); });
    window.NOBLAE_paginate(feed, '.feed-item');
  });

})();
</script>
