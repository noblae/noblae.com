<script>
(function(){
  "use strict";

  // ---------- home feed ----------
  // Pulls every entry from the Poetry, Essays and Fights pages, so new
  // content only ever needs to be added on its own page.
  var SOURCES = [
    { url: 'poetry.html', selector: '.poem',       kind: 'poem'  },
    { url: 'essays.html', selector: '.essay',      kind: 'essay' },
    { url: 'fights.html', selector: '.fight-card', kind: 'fight' }
  ];
  var DATE_RE = /(\d{2})\.(\d{2})\.(\d{2})/;

  var feed = document.getElementById('feed');

  function load(src){
    // cache-bust: without this, browsers (and GitHub's CDN) can serve a
    // stale copy of poetry.html/essays.html/fights.html here even right
    // after the admin panel has updated the live file
    return fetch(src.url + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(html){
        var doc = new DOMParser().parseFromString(html, 'text/html');
        return Array.prototype.slice.call(doc.querySelectorAll(src.selector)).map(function(el){
          return entryFrom(el, src.kind);
        }).filter(Boolean);
      })
      .catch(function(){ return []; });
  }

  // Finds the entry's MM.DD.YY date, pulls it out of the entry, and
  // returns the entry with the date placed at its bottom-right.
  function entryFrom(el, kind){
    var dateEl = el.querySelector('.poem-date, .entry-date, .fight-meta .tag');
    var m = dateEl && dateEl.textContent.match(DATE_RE);
    if (!m) return null;
    var label = m[0];
    if (dateEl.classList.contains('tag')){
      dateEl.textContent = dateEl.textContent.replace(DATE_RE, '').replace(/[\s\u00b7]+$/, '');
    } else {
      dateEl.remove();
    }

    var item = document.createElement('article');
    item.className = 'feed-item feed-' + kind;
    item.appendChild(document.importNode(el, true));
    var date = document.createElement('span');
    date.className = 'entry-date feed-date';
    date.textContent = label;
    item.appendChild(date);

    return { node: item, time: new Date(2000 + +m[3], +m[1] - 1, +m[2]).getTime() };
  }

  Promise.all(SOURCES.map(load)).then(function(lists){
    var entries = [].concat.apply([], lists);
    // newest first; entries on the same day keep their page order
    entries.forEach(function(e, i){ e.order = i; });
    entries.sort(function(a, b){ return (b.time - a.time) || (a.order - b.order); });
    entries.forEach(function(e){ feed.appendChild(e.node); });
  });

})();
</script>
