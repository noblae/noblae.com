<script>
(function(){
  "use strict";
  var listEl = document.getElementById('photoList');
  var moreBtn = document.getElementById('photoMore');
  var BATCH = 9, shown = 0, posts = [], embedLoaded = false;

  function processEmbeds(){
    if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
  }
  function loadEmbedScript(){
    if (embedLoaded) return processEmbeds();
    embedLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.instagram.com/embed.js';
    s.onload = processEmbeds;
    document.body.appendChild(s);
  }
  function postEl(p){
    var link = 'https://www.instagram.com/' + p.type + '/' + p.code + '/';
    var wrap = document.createElement('div');
    wrap.className = 'photo';
    var bq = document.createElement('blockquote');
    bq.className = 'instagram-media';
    bq.setAttribute('data-instgrm-permalink', link + '?utm_source=ig_embed&utm_campaign=loading');
    bq.setAttribute('data-instgrm-version', '14');
    bq.style.cssText = 'background:#fff;border:0;border-radius:3px;box-shadow:0 0 1px 0 rgba(0,0,0,.5),0 1px 10px 0 rgba(0,0,0,.15);margin:1px;max-width:540px;min-width:326px;padding:0;width:99.375%;';
    var a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'View this post on Instagram';
    a.style.cssText = 'display:block;padding:40px 16px;text-align:center;color:#3897f0;font-family:Arial,sans-serif;font-size:14px;text-decoration:none;';
    bq.appendChild(a);
    wrap.appendChild(bq);
    return wrap;
  }
  function showMore(){
    var end = Math.min(shown + BATCH, posts.length);
    for (var i = shown; i < end; i++) listEl.appendChild(postEl(posts[i]));
    shown = end;
    moreBtn.hidden = shown >= posts.length;
    loadEmbedScript();
  }
  moreBtn.addEventListener('click', showMore);

  fetch('modeling.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : []; })
    .catch(function(){ return []; })
    .then(function(list){
      posts = (Array.isArray(list) ? list : []).filter(function(p){ return p && p.type && p.code; });
      if (!posts.length){
        var p = document.createElement('p');
        p.className = 'gallery-intro';
        p.textContent = 'Nothing here yet. See them on Instagram.';
        listEl.appendChild(p);
        return;
      }
      showMore();
    });
})();
</script>
