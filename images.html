<script>
(function(){
  "use strict";

  // ---------- gallery: images.json (admin uploads) + anything in images/gallery ----------
  var list = document.getElementById('imageList');
  var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var FOLDER_URL = (LOCAL ? '/__dev_api' : 'https://api.github.com') +
                   '/repos/noblae/noblae.com/contents/images/gallery?ref=main';
  function getJSON(url){
    return fetch(url, { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : []; })
      .catch(function(){ return []; });
  }
  Promise.all([getJSON('images.json?v=' + Date.now()), getJSON(FOLDER_URL)])
    .then(function(r){ return window.NOBLAE_mergeImages(r[0], r[1]); })
    .then(function(images){
      images.forEach(function(img){
        var fig = document.createElement('figure');
        var a = document.createElement('a');
        a.href = img.src; a.target = '_blank'; a.rel = 'noopener';
        var el = document.createElement('img');
        el.src = img.src; el.alt = img.caption || ''; el.loading = 'lazy';
        a.appendChild(el);
        fig.appendChild(a);
        if (img.caption){
          var cap = document.createElement('figcaption');
          cap.textContent = img.caption;
          fig.appendChild(cap);
        }
        list.appendChild(fig);
      });
      window.NOBLAE_paginate(list, 'figure');
    });
})();
</script>
